<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Başkan</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    font-family: 'Inter', sans-serif;
    color: white;
    background: url("baskan.jpg") center center / cover no-repeat;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.75)
    );
}

.container {
    position: relative;
    text-align: center;
    max-width: 800px;
    padding: 40px;
    animation: fadeUp 1.8s ease forwards;
    opacity: 0;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    letter-spacing: 3px;
    font-weight: 800;
}

.subtitle {
    margin-top: 20px;
    font-size: 1.2rem;
    font-weight: 300;
    opacity: 0.85;
    letter-spacing: 1px;
}

.line {
    width: 80px;
    height: 2px;
    background: white;
    margin: 30px auto;
    opacity: 0.7;
}

@keyframes fadeUp {
    from {
        transform: translateY(40px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@media (max-width: 768px) {
    h1 {
        font-size: 2.5rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>İYİ Kİ DOĞDUN BAŞKAN</h1>
    <div class="line"></div>
    <p class="subtitle">
        Hedeflerine başarı ile ulaşman dileğiyle.
    </p>
</div>

</body>
</html>
